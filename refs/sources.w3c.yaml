  - key: vcdm2-rendermethod
    title: "Verifiable Credentials Data Model v2.0"
    author: "W3C Verifiable Credentials Working Group"
    url: "https://www.w3.org/TR/vc-data-model-2.0/"
    retrieved: "2026-09-04"
    capture: "refs/captures/w3c/vc-data-model-2.0-TR.html; also vendored at ~/code/me/vc-data-model/index.html (identical text verified)"
    status: primary
    supports: "renderMethod is a reserved extension point in VCDM 2.0, defined as experimental/not-yet-stable"
    quote: "A property used for specifying one or more methods to render a credential into a visual, auditory, haptic, or other format. The associated vocabulary URL MUST be `https://www.w3.org/2018/credentials#renderMethod`. ... Implementers MAY use these properties, but SHOULD expect them and/or their meanings to change during the process of normatively specifying them. Implementers SHOULD NOT use these properties without a publicly disclosed specification describing their implementation."
    locator: "Section on Reserved Extension Points, renderMethod row of Reserved Property table"

  - key: vcdm2-code-injection
    title: "Verifiable Credentials Data Model v2.0"
    author: "W3C Verifiable Credentials Working Group"
    url: "https://www.w3.org/TR/vc-data-model-2.0/"
    retrieved: "2026-09-04"
    capture: "refs/captures/w3c/vc-data-model-2.0-TR.html; also vendored at ~/code/me/vc-data-model/index.html (identical text verified)"
    status: primary
    supports: "VCDM 2.0 Security Considerations warns against HTML/script content in credential data generally, recommends sandboxed no-network rendering"
    quote: "Despite the ability to encode information as HTML, implementers are strongly discouraged from doing so ... It increases the security attack surface when using this data model, because naively processing HTML could result in the execution of a `script` tag that an attacker injected at some point during the data production process. ... running the HTML rendering engine in a sandbox with no ability to access the network."
    locator: "Security Considerations > Code Injection"

  - key: vcrm-tr-card
    title: "Verifiable Credential Rendering Methods v1.0"
    author: "W3C Verifiable Credentials Working Group"
    url: "https://www.w3.org/TR/vc-render-method/"
    retrieved: "2026-09-04"
    capture: "refs/captures/w3c/vc-render-method-TR-latest.html"
    status: primary
    supports: "card render suite is a JSON, non-executing, JSON-Pointer-substitution mechanism"
    quote: "The card render suite uses JSON templates to transform a verifiable credential into a standardized data display format. This format enables wallets to display credentials in a responsive card layout with key data highlighted and configurable additional fields."
    locator: "Section 2.2.1 The card Render Suite"

  - key: vcrm-tr-card-algo
    title: "Verifiable Credential Rendering Methods v1.0"
    author: "W3C Verifiable Credentials Working Group"
    url: "https://www.w3.org/TR/vc-render-method/"
    retrieved: "2026-09-04"
    capture: "refs/captures/w3c/vc-render-method-TR-latest.html"
    status: primary
    supports: "card render suite processing algorithm performs pure JSON Pointer substitution with schema validation, no code execution"
    quote: "Validate the template JSON object against the JSON template schema ... For each string value in the template object: ... Validate the resulting JSON object against the card output schema."
    locator: "Section 3.1 Card Template Processing"

  - key: vcrm-tr-html
    title: "Verifiable Credential Rendering Methods v1.0"
    author: "W3C Verifiable Credentials Working Group"
    url: "https://www.w3.org/TR/vc-render-method/"
    retrieved: "2026-09-04"
    capture: "refs/captures/w3c/vc-render-method-TR-latest.html"
    status: primary
    supports: "html render suite executes issuer-supplied JavaScript inside a sandboxed iframe; remote template fetch SHOULD use Oblivious HTTP for privacy"
    quote: "JavaScript within the HTML fragment is responsible for rendering the filtered verifiable credential data provided via an HTML data block (i.e. <script type=\"application/vc\"></script>) hosted in a sandboxed iframe alongside the HTML template. ... a host page SHOULD protect the privacy of any request made (for example, dereferencing template.id) by using Oblivious HTTP [RFC9458] or other means of disassociating the requesting client from the requested origin by using a protecting relay."
    locator: "Section 2.2.2 The html Render Suite"

  - key: vcrm-tr-nfc
    title: "Verifiable Credential Rendering Methods v1.0"
    author: "W3C Verifiable Credentials Working Group"
    url: "https://www.w3.org/TR/vc-render-method/"
    retrieved: "2026-09-04"
    capture: "refs/captures/w3c/vc-render-method-TR-latest.html"
    status: primary
    supports: "nfc render suite is a static binary payload with no rendering logic"
    quote: "The nfc render suite transmits a binary payload representing the verifiable credential over a wireless NFC connection."
    locator: "Section 2.2.3 The nfc Render Suite"

  - key: vcrm-tr-secstub
    title: "Verifiable Credential Rendering Methods v1.0"
    author: "W3C Verifiable Credentials Working Group"
    url: "https://www.w3.org/TR/vc-render-method/"
    retrieved: "2026-09-04"
