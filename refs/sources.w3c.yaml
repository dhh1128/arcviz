    supports: "The document's own Security/Privacy Considerations sections are stub redirects to Appendix A Threat Model"
    quote: "W3C is migrating to a holistic threat modelling approach and is in the process of deprecating the Security Considerations sections in new specifications. Please refer to Appendix A. Threat Model for documentation related to security considerations."
    locator: "Security Considerations (top-level section, post-Appendix A)"

  - key: vcrm-tr-hostpage
    title: "Verifiable Credential Rendering Methods v1.0"
    author: "W3C Verifiable Credentials Working Group"
    url: "https://www.w3.org/TR/vc-render-method/"
    retrieved: "2026-09-04"
    capture: "refs/captures/w3c/vc-render-method-TR-latest.html"
    status: primary
    supports: "Normative host-page requirements: CSP frame-src none, sandbox=allow-scripts, forces srcdoc over src"
    quote: "At minimum, the environment MUST prevent navigation, loading of external content, and access to the host page in order to prevent tracking and other privacy harms. ... The Content Security Policy (CSP) restrictions MUST include frame-src 'none'. This forces the use of srcdoc instead of src for iframes, which prevents the browser from loading the HTML template. ... sandbox=\"allow-scripts\" MUST be set on the iframe hosting the HTML template to prevent navigation and top-level access."
    locator: "Section 2.2.2.1 Host Page"

  - key: vcrm-tr-wrapper
    title: "Verifiable Credential Rendering Methods v1.0"
    author: "W3C Verifiable Credentials Working Group"
    url: "https://www.w3.org/TR/vc-render-method/"
    retrieved: "2026-09-04"
    capture: "refs/captures/w3c/vc-render-method-TR-latest.html"
    status: primary
    supports: "Wrapper code MUST add CSP default-src data: 'unsafe-inline' to block network requests from template code"
    quote: "the wrapper code MUST add the following CSP restrictions of default-src data: 'unsafe-inline' to prevent any network requests from being made by the template code."
    locator: "Section 2.2.2.1.2 Wrapper Code"

  - key: vcrm-tr-relationship
    title: "Verifiable Credential Rendering Methods v1.0"
    author: "W3C Verifiable Credentials Working Group"
    url: "https://www.w3.org/TR/vc-render-method/"
    retrieved: "2026-09-04"
    capture: "refs/captures/w3c/vc-render-method-TR-latest.html"
    status: primary
    supports: "Appendix B compares against client-determined rendering, display registries, static documents, and SD-JWT VC svg_templates, explaining why each was not adopted"
    quote: "SD-JWT VC defines a rendering property to choose between a simple method that supports a fixed set of styling attributes, and an svg_templates method that forbids any code execution and substitutes claim values into text placeholders in an SVG. The group explored this approach and found it too limited for real-world use cases: because placeholders appear only in text nodes and no code can run, data-driven presentation tools such as conditional fields, variable-length lists, value formatting, and responsive layout cannot be expressed."
    locator: "Appendix B, Relationship to Other Technologies > SD-JWT VC Type Metadata Rendering"

  - key: vcrm-threat-model-doc
    title: "Verifiable Credentials Render Method Threat Model"
    author: "W3C Verifiable Credentials Working Group / VC Render Method Task Force"
    url: "https://www.w3.org/TR/vc-render-method/threat-model/"
    retrieved: "2026-09-04"
    capture: "refs/captures/w3c/vc-render-method-threat-model.html, .txt"
    status: primary
    supports: "Threat model follows W3C Threat Modeling Guide / STRIDE, structured into Target/Implementation/Deployment/External/Dependency threats; Render process description distinguishes executing (html) vs non-executing (card, nfc) suites"
    quote: "For the `html` render suite it executes template-supplied code inside a confined rendering environment; for the `card` and `nfc` render suites it produces a standardized output or emits a static payload without executing template-supplied code. The specification defines the confinement for the `html` suite in terms of required security outcomes rather than a specific mechanism. A sandboxed browser iframe with a Content Security Policy is one common way to achieve those outcomes, but it is an implementation detail, and equivalent isolation can be provided by other means."
    locator: "Dictionary, P3 Render row"

  - key: vcrm-t2
    title: "Verifiable Credentials Render Method Threat Model — T2 Unsafe Rendering of Untrusted Data"
    author: "W3C Verifiable Credentials Working Group / VC Render Method Task Force"
    url: "https://raw.githubusercontent.com/w3c/vc-render-method/main/threat-model/threats/t2-unsafe-rendering-of-untrusted-data.yaml"
    retrieved: "2026-09-04"
    capture: "refs/captures/w3c/threat-model-yaml/t2-unsafe-rendering-of-untrusted-data.yaml"
    status: primary
    supports: "T2 is the issuer-template-executes-in-verifier's-context threat; its R1 mitigation is environment confinement (sandboxed iframe + CSP denying network requests), described as an implementation detail not a mandated specific mechanism"
    quote: "Both the template code and the credential values placed in the data block are untrusted input from the point of view of the software running the Render process. Template code, or a credential value it consumes, can attempt to reach the surrounding holder system or verifier system, navigate away, or load and contact external locations, giving hostile content access to the context in which it renders. Successful verification of the credential's securing mechanism confirms that the content is authentic, not that it is safe to render. ... A browser based implementation, for example, can realize it by hosting the template in a sandboxed iframe that permits scripting but blocks navigation and top-level access, together with wrapper code that adds a Content Security Policy denying network requests."
    locator: "threat-model/threats/t2-unsafe-rendering-of-untrusted-data.yaml, description and response R1"

  - key: vcrm-t3
    title: "Verifiable Credentials Render Method Threat Model — T3 Tracking via Template and Resource Fetches"
    author: "W3C Verifiable Credentials Working Group / VC Render Method Task Force"
    url: "https://raw.githubusercontent.com/w3c/vc-render-method/main/threat-model/threats/t3-tracking-via-template-and-resource-fetches.yaml"
    retrieved: "2026-09-04"
    capture: "refs/captures/w3c/threat-model-yaml/t3-tracking-via-template-and-resource-fetches.yaml"
    status: primary
    supports: "T3 covers the 'privacy beacon' risk: a template with external resource loading can exfiltrate credential data via request URLs; mitigations are blocking network access during render (R1) and caching/OHTTP/embedding (R2)"
    quote: "In the `html` render suite, a template that is permitted to load external content could also encode credential data into the URLs of resources it fetches, such as image requests, exfiltrating rendered data to an external location. ... The rendering environment prevents the template from initiating its own network requests, so that a template cannot fetch per-user resources or encode credential data into outbound requests while rendering. ... An issuer that prioritizes offline use and unlinkability embeds the template and its resources in the credential, accepting the increase in credential size."
    locator: "threat-model/threats/t3-tracking-via-template-and-resource-fetches.yaml, description and responses R1/R2"

  - key: vcrm-t4
    title: "Verifiable Credentials Render Method Threat Model — T4 Harmful Rendering Output"
    author: "W3C Verifiable Credentials Working Group / VC Render Method Task Force"
    url: "https://raw.githubusercontent.com/w3c/vc-render-method/main/threat-model/threats/t4-harmful-rendering-output.yaml"
    retrieved: "2026-09-04"
    capture: "refs/captures/w3c/threat-model-yaml/t4-harmful-rendering-output.yaml"
    status: primary
    supports: "T4's scope is physiological harm (flashing/loud sound), typed Accept as an external condition, not chrome-spoofing"
    quote: "The possibility that arbitrary visual or auditory output can affect a susceptible person exists for any technology that renders content and is not something the Render Method specification eliminates. This threat is documented so that implementers and deployers are aware of it and can apply platform-level and accessibility protections appropriate to their context."
    locator: "threat-model/threats/t4-harmful-rendering-output.yaml, response R1"

  - key: vcrm-t5
    title: "Verifiable Credentials Render Method Threat Model — T5 Inherited Rendering Environment Attack Surface"
    author: "W3C Verifiable Credentials Working Group / VC Render Method Task Force"
    url: "https://raw.githubusercontent.com/w3c/vc-render-method/main/threat-model/threats/t5-inherited-rendering-environment-attack-surface.yaml"
    retrieved: "2026-09-04"
    capture: "refs/captures/w3c/threat-model-yaml/t5-inherited-rendering-environment-attack-surface.yaml"
    status: primary
    supports: "T5 acknowledges the sandbox itself is a trust boundary that can be defeated by a defect in the underlying environment; R2 recommends defense in depth and preferring non-executing suites where feasible"
    quote: "The safety of rendering inherits the security of that underlying mechanism: a defect that lets the confinement be escaped, a policy be bypassed, or the isolation between the template and the host be broken becomes a defect in the render process, even when the render method is used exactly as specified. ... constrained suites such as `card` and `nfc`, which do not execute template code, are preferred where they meet the use case."
    locator: "threat-model/threats/t5-inherited-rendering-environment-attack-surface.yaml, description and response R2"

  - key: vcrm-old-ed-algo
    title: "Verifiable Credential Rendering Methods (editor's draft, 2025-04-06, commit 9758ff76)"
    author: "W3C Credentials Community Group / w3c/vc-render-method contributors"
    url: "https://raw.githubusercontent.com/w3c/vc-render-method/9758ff76/index.html"
    retrieved: "2026-09-04"
    capture: "refs/captures/w3c/vc-render-method-2025-04-06-ED.html"
    status: primary
    supports: "The now-removed svg-mustache mechanism performed Mustache-style {{jsonPointer}} substitution directly into SVG source text, with no sandboxing"
    quote: "Generate a map, `replacementMap`, by finding all strings in `svgImage` that start with `{{` (double open braces) and end with `}}` (double close braces). For each string, `templateKey`, that is found: Generate another string, `templateValue`, by evaluating the value of `templateKey` ... using the JSON Pointer [RFC6901] algorithm ... For every key in `replacementMap`, replace each corresponding string in `svgImage` that matches the key with the associated value in the `replacementMap`."
    locator: "Algorithms > Render (TemplateRenderMethod), commit 9758ff76"

  - key: vcrm-old-ed-security
    title: "Verifiable Credential Rendering Methods (editor's draft, 2025-04-06, commit 9758ff76)"
    author: "W3C Credentials Community Group / w3c/vc-render-method contributors"
    url: "https://raw.githubusercontent.com/w3c/vc-render-method/9758ff76/index.html"
    retrieved: "2026-09-04"
    capture: "refs/captures/w3c/vc-render-method-2025-04-06-ED.html"
    status: primary
    supports: "The April 2025 draft's Security Considerations section was an unfinished, unconverted issue-flagged bullet list, and never mentioned script/code injection risk for the svg-mustache mechanism"
    quote: "The list of security considerations listed below need to be converted into sections: If a cryptographic hash for a display template isn't provided, you can't know if it has been tampered with since issuance. ... Fetching resources from external locations can be used as a denial-of-service attack vector where the resource is never served, or served at a very slow pace."
    locator: "Security Considerations section, commit 9758ff76"

  - key: vcrm-old-ed-oa
    title: "Verifiable Credential Rendering Methods (editor's draft, 2025-04-06, commit 9758ff76)"
