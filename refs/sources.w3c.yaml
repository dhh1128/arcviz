  - key: sdjwtvc-security
    title: "SD-JWT-based Verifiable Credentials (SD-JWT VC), draft-ietf-oauth-sd-jwt-vc-13"
    author: "IETF OAuth Working Group"
    url: "https://www.ietf.org/archive/id/draft-ietf-oauth-sd-jwt-vc-13.html"
    retrieved: "2026-09-04"
    capture: "refs/captures/w3c/sd-jwt-vc-draft13.html"
    status: primary
    supports: "SD-JWT VC flatly prohibits code execution in SVG templates (MUST NOT execute) and requires sandboxing if execution cannot be reliably prevented, plus a tracking-prevention requirement for external resources"
    quote: "When rendering the SVG template, the consuming application MUST ensure that malicious metadata providers or issuers cannot inject executable code into the SVG template and thereby compromise the security of the consuming application. The consuming application MUST NOT execute any code in the SVG template. If code execution cannot be prevented reliably, the SVG display MUST be sandboxed. Furthermore, consuming applications MUST ensure that references to external resources (images, etc.) from within the SVG cannot be used to track users or the usage of credentials."
    locator: "Section 8.1.2, paragraph following the SVG placeholder example"

