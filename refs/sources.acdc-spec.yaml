  - key: acdc-spec-e1e-normative
    title: "E1E identity edge operator — normative on v1.1 (was: proposed, unmerged)"
    author: "ToIP KERI/ACDC/CESR Kantara/KSWG Task Force (merged from Daniel Hardman's proposal)"
    url: "https://raw.githubusercontent.com/trustoverip/kswg-acdc-specification/v1.1/spec/spec-body.md"
    retrieved: "2026-09-11"
    capture: "same capture as acdc-spec-v11 (commit 910c74a); recorded as its own record because the prior revision of acdc-inventory.md carried a now-superseded record (acdc-spec-e1e-proposal, retired) treating E1E as an unmerged proposal on a local branch, and this correction should be traceable"
    status: primary
    supports: "E1E is part of the normative unary Edge-operator table on v1.1, with the default-injection clause amended to name it, per PR 'Add E1E identity edge operator to the unary Operator table' merged into v1.1 (not main) 2026-08-11"
    quote: "`E1E`| IssueE-To-IssueE, The Issuee AID of this ACDC MUST be the Issuee AID of the node this Edge points to. This is an identity relation on the two ACDCs' Issuees and places no constraint on either ACDC's Issuer."
    locator: "toip/v1.1:spec/spec-body.md:1206 (table row); full semantics at :1223; amended default-injection clause at :1209"

  - key: acdc-spec-dp-construct
    title: "Disclosure Paths (dp) — normative on v1.1, absent from main"
    author: "ToIP KERI/ACDC/CESR Kantara/KSWG Task Force (Daniel Hardman, PR #203)"
    url: "https://raw.githubusercontent.com/trustoverip/kswg-acdc-specification/v1.1/spec/spec-body.md"
    retrieved: "2026-09-11"
    capture: "same capture as acdc-spec-v11 (commit 910c74a)"
    status: primary
    supports: "The complete Disclosure Paths construct: DAG-of-ACDCs framing, path syntax (labeled/indexed components, DAG-absolute vs ACDC-relative, the `_` Edge-hop component), node vs. leaf paths, closures, the `dp` field's three-element-tuple structure and Path Prefix rules, breadth-first tuple ordering, Solicited Response semantics, Aggregate Section Pathing, and binding into the IPEX `apply`/`offer` messages — all documented in acdc-inventory.md §9"
    quote: "The value of the Disclosure Paths, `dp`, field is a list of tuples. Each tuple represents one ACDC in the DAG that is the object of the exchange and is of the form `(ACDCSchemaSAID, PathPrefix, [paths])`."
    locator: "toip/v1.1:spec/spec-body.md:1881 (dp field definition); section spans :1809-1994 across four headings"

  - key: dossier-spec-main
    title: "Verifiable Dossier Specification — spec/dossier-spec-body.md (trustoverip/kswg-dossier-specification@main)"
    author: "Daniel Hardman et al., ToIP KSWG"
    url: "https://raw.githubusercontent.com/trustoverip/kswg-dossier-specification/main/spec/dossier-spec-body.md"
    retrieved: "2026-09-04, re-verified unchanged 2026-09-11"
    capture: "fetched to /tmp for this reading, not persisted in-repo; commit b9227753cc1bbb92ed237970fc3b89bf1d0c904f, still current as of 2026-09-11. Used in preference to the vendored checkout (see dossier-spec-vendored-stale below) because main corrects a substantive terminology error present in the vendored copy."
    status: primary
    supports: "Dossier-as-ACDC structure; edges-as-primary-payload vs a-section-as-proximate-metadata; anchoring (not signing) as the authentication mechanism, with the narrow ephemeral-attached-signature exception; the four joint-issuance threshold operators MxN/RMxN/MxQ/RMxQ and their slot-disposition mechanics (Pending/Endorsed/Declined); finalization via the `fi` field; independently configurable revocation thresholds; Annotation Edges as the mechanism for mutable-looking state over immutable ACDCs"
    quote: "A dossier is not a signed document. The issuer does not compute a signature over the dossier ACDC and attach that signature to it as proof of authenticity, which is what \"signing a credential\" means in most other verifiable credential ecosystems. Instead: 1. The assembled dossier ACDC is saidified, yielding its SAID. 2. The issuer constructs a seal containing that SAID. 3. The issuer anchors the seal in an append-only verifiable log..."
    locator: "spec/dossier-spec-body.md, section 'How a Dossier Is Issued: Anchoring, Not Attached Signatures' (near top of file, before 'The Role of the Issuer'), as of commit b9227753"

