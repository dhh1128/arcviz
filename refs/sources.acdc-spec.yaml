    status: secondary
    supports: "Recorded ONLY to document staleness: this vendored checkout describes dossier issuance as direct signing ('The issuer's signature makes a specific, verifiable assertion...'), which trustoverip/kswg-dossier-specification@main has since corrected to an anchoring model. Not cited as a source for any normative claim in acdc-inventory.md; dossier-spec-main is used instead throughout."
    quote: "The issuer of a dossier is the entity that curates the collection of evidence and attests to its composition by digitally signing the container. The issuer's signature makes a specific, verifiable assertion..."
    locator: "spec/dossier-spec-body.md:9 (vendored checkout, commit 7669358)"

