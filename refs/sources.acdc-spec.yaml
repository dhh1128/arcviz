# arcviz ACDC-spec source record (audit stream 2A — ACDC field and section inventory).
#
# Same schema as ../sources.yaml; see ../docs/research/EVIDENCE.md for the rules.
# Owned exclusively by the Phase 2A ACDC-inventory stream. Do not merge into sources.yaml
# without checking for key collisions first.
#
# Capture note: all three specs live as local git checkouts under ~/code/me/, which already
# satisfies EVIDENCE.md rule 3 ("capture it locally") — persistent, version-controlled local
# copies, not fetched-and-discarded web pages. As of the 2026-09-11 rebase, the ACDC spec's
# primary source is read via the `toip` remote directly (branch v1.1, not the vendored repo's
# checked-out branch) per AGENTS.md rule 5: "the specification" is two diverged branches of
# `trustoverip/kswg-acdc-specification`, and `v1.1` — not the locally-checked-out branch, not
# `main` — is ahead on content. The vendored ACDC checkout is retained only as a historical
# record of what the prior revision was built from (see acdc-spec-vendored-superseded below).
# CESR and dossier are still read from their vendored checkouts, cross-checked against their
# respective `main` branches, per the original convention. Where a vendored checkout was found
# stale or diverged from `main`/`v1.1` on a cited passage (see acdc-inventory.md "Sources read"),
# the quote is instead sourced from that branch's own capture and that is noted explicitly.

sources:
  - key: acdc-spec-v11
    title: "Authentic Chained Data Container (ACDC) Specification — spec/spec-body.md (trustoverip/kswg-acdc-specification@v1.1)"
    author: "ToIP KERI/ACDC/CESR Kantara/KSWG Task Force (Samuel M. Smith et al.)"
    url: "https://raw.githubusercontent.com/trustoverip/kswg-acdc-specification/v1.1/spec/spec-body.md"
    retrieved: "2026-09-11"
    capture: "read via the `toip` remote in ~/code/me/kswg-acdc-specification (`git fetch toip`, `git show toip/v1.1:spec/spec-body.md`), not persisted as a separate file in this repo; commit 910c74afce07e29c308015dabad9a576cc542f4d (2026-08-27). Primary source for all ACDC content in acdc-inventory.md as of this revision — see that document's 'Sources read' and 'Corrections from the 2026-09-05 revision' for why this replaces the previously-vendored checkout as primary."
    status: primary
    supports: "All top-level ACDC field definitions and ordering including the UE (unique entropy) rename and the new `_` DAG-hop reserved label; the new Field Label Restrictions subsection; the a-vs-A (Attribute vs Aggregate) selective/partial-disclosure distinction; the complete Edge section (Edge-group, Edge, unary/m-ary operators) including the normative `E1E` operator and its amended default-injection clause; the complete Rule section; the seven named Graduated Disclosure mechanisms; Contractually Protected Disclosure; blinding/unique-entropy mechanics at every nesting level; the new Disclosure Paths (`dp`) construct in full (DAG/path syntax, closures, Aggregate Section Pathing, IPEX binding); TEL registry message types and the Blinded Attribute Block; ACDC Protocol Message Types and top-level field ordering for CESR-native forms"
    quote: "When present, the top-level fields MUST appear in the following order: `[v, t, d, u, i, rd, s, a, A, e, r]`."
    locator: "spec/spec-body.md:32 (Field Ordering, unchanged position on v1.1); see docs/research/acdc-inventory.md for the full set of quoted passages with individual line locators across this file"

