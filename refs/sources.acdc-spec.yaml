    status: primary
    supports: "All top-level ACDC field definitions and ordering; the a-vs-A (Attribute vs Aggregate) selective/partial-disclosure distinction; the complete Edge section (Edge-group, Edge, unary/m-ary operators); the complete Rule section; the seven named Graduated Disclosure mechanisms (Compact/Metadata/Partial/Nested Partial/Full/Selective/Bulk-issued Instance Disclosure); Contractually Protected Disclosure (Chain-link Confidentiality, Contingent Disclosure); blinding/UUID mechanics at every nesting level; TEL registry message types and the Blinded Attribute Block; ACDC Protocol Message Types and top-level field ordering for CESR-native forms"
    quote: "When present, the top-level fields MUST appear in the following order: `[v, t, d, u, i, rd, s, a, A, e, r]`."
    locator: "spec/spec-body.md:32 (Field Ordering); see docs/research/acdc-inventory.md for the full set of ~40 quoted passages with individual line locators across this file"

