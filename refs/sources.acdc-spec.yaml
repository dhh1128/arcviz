    quote: "The issuer of a dossier is the entity that curates the collection of evidence and attests to its composition by digitally signing the container. The issuer's signature makes a specific, verifiable assertion..."
    locator: "spec/dossier-spec-body.md:9 (vendored checkout, commit 7669358)"

