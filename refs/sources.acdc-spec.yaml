  - key: acdc-spec-vendored
    title: "Authentic Chained Data Container (ACDC) Specification — spec/spec-body.md"
    author: "ToIP KERI/ACDC/CESR Kantara/KSWG Task Force (Samuel M. Smith et al.)"
    url: "https://trustoverip.github.io/kswg-acdc-specification/"
    retrieved: "2026-09-04"
