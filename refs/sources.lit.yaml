  # --- Cluster 4: design theory ---

  - key: norman2008signifiers
    title: "Signifiers, Not Affordances"
    author: "Don Norman"
    url: "https://jnd.org/signifiers-not-affordances/"
    retrieved: "2026-09-04"
    capture: ".ignored/private-refs/papers/norman-signifiers-not-affordances-2008-jnd.html"
    status: primary
    supports: "Norman's own account, in his own words, of why he moved from 'affordance' to 'signifier' as the term design should center — the essay that motivates the 2013 DoET revision. Establishes that a signifier can work by absence, not just by presence, which is directly relevant to how arcviz should treat an undisclosed/absent node: absence itself can be a legitimate, designed signal rather than a rendering failure."
    quote: "The perceivable part of an affordance is a signifier, and if deliberately placed by a designer, it is a social signifier. Designers of the world: Forget affordances provide signifiers. [...] Social signifiers replace affordances, for they are broader and richer, allowing for accidental signifiers as well as deliberate ones, and even for items that signify by their absence, as the lack of crowds on a train platform."
    locator: "Originally published in ACM Interactions, vol. 15, issue 6, 2008; self-archived by the author at jnd.org, posted 2008-11-17. Capture note: the page states it is posted 'by permission of ACM for your personal use,' a narrower grant than jnd.org's site-wide CC BY-NC license, so per AGENTS.md's publication-hygiene rule this capture is treated as not-for-republication and lives in .ignored/private-refs/ even though the page itself is public."

  - key: norman_jnd_preface_doet2013
    title: "Preface, Design of Everyday Things, Revised Edition"
    author: "Don Norman"
    url: "https://jnd.org/preface-design-of-everyday-things-revised-edition/"
    retrieved: "2026-09-04"
    capture: "refs/captures/lit/norman-preface-doet-revised-edition-jnd.html"
    status: primary
    supports: "Norman's own summary, in his own words, of the single biggest conceptual change in the 2013 revision: the affordance/signifier split, and why signifiers matter more to a designer than affordances do. This is the vocabulary the task asked us to get right; note this is Norman's preface essay on his own site (CC BY-NC licensed per the page footer), not a verified read of the book chapter itself."
    quote: "Affordances define what actions are possible. Signifiers specify how people discover those possibilities: signifiers are signs, perceptible signals of what can be done. [...] The first edition had a focus upon affordances, but although affordances make sense for interaction with physical objects, they are confusing when dealing with virtual ones. As a result, affordances have created much confusion in the world of design. Signifiers are of far more importance to designers than are affordances."
    locator: "jnd.org, preface essay for the 2013 revised edition of The Design of Everyday Things; page carries a site-wide CC BY-NC 4.0 license per its footer"

  - key: norman_affordances_and_design
    title: "Affordances and Design"
    author: "Don Norman"
    url: "https://jnd.org/affordances-and-design/"
    retrieved: "2026-09-04"
    capture: "refs/captures/lit/norman-affordances-and-design-jnd.html"
    status: primary
    supports: "Norman's own clarification, in his own words, that the term 'affordance' properly names an actor-independent relationship (Gibson's original sense), and that what design actually needs is the narrower, perception-dependent concept he later renamed 'perceived affordance' / 'signifier.' Directly forbids the loose usage where 'affordance' is used to mean 'a UI element that looks clickable' — that is a perceived affordance / signifier, and conflating the two is exactly the misuse the task flagged."
    quote: "The word “affordance” was originally invented by the perceptual psychologist J. J. Gibson (1977, 1979) to refer to the actionable properties between the world and an actor (a person or animal). To Gibson, affordances are a relationship. [...] I should have used the term ‘perceived affordance,’ for in design, we care much more about what the user perceives than what is actually true. [...] What the designer cares about is whether the user perceives that some action is possible (or in the case of perceived non-affordances, not possible)."
    locator: "jnd.org essay; page carries a site-wide CC BY-NC 4.0 license per its footer"

  - key: nielsen1994heuristics
    title: "10 Usability Heuristics for User Interface Design"
    author: "Jakob Nielsen (Nielsen Norman Group)"
    url: "https://www.nngroup.com/articles/ten-usability-heuristics/"
    retrieved: "2026-09-04"
    capture: "refs/captures/lit/nielsen-ten-usability-heuristics-nngroup.html"
    status: primary
    supports: "The canonical statement of 'visibility of system status' and 'match between system and the real world,' the two heuristics most directly load-bearing for arcviz: a viewer must always be able to tell which of absent/undisclosed/redacted/unverified/verified state a node is in (visibility of status), and the visual vocabulary for that must not require the user to learn arcviz-internal jargon to read it (match with the real world)."
    quote: "The design should always keep users informed about what is going on, through appropriate feedback within a reasonable amount of time. [...] The design should speak the users' language. Use words, phrases, and concepts familiar to the user, rather than internal jargon. [...] They are called \"heuristics\" because they are broad rules of thumb and not specific usability guidelines."
    locator: "nngroup.com/articles/ten-usability-heuristics/ (heuristics #1 and #2; originally Nielsen & Molich 1990, refined Nielsen 1994, page last updated by NN/g in 2020)"

  - key: nngroup_progressive_disclosure
    title: "Progressive Disclosure"
    author: "Nielsen Norman Group"
    url: "https://www.nngroup.com/articles/progressive-disclosure/"
    retrieved: "2026-09-04"
    capture: "refs/captures/lit/nngroup-progressive-disclosure.html"
    status: primary
    supports: "The definition of progressive disclosure arcviz's expand-a-card / toggle-raw-vs-pretty affordances are an instance of, plus NN/g's stated failure mode when it is used past two levels."
    quote: "Progressive disclosure defers advanced or rarely used features to a secondary screen, making applications easier to learn and less error-prone."
    locator: "nngroup.com/articles/progressive-disclosure/"

