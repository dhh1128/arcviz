sources:

  # --- Cluster 2: security indicators and their failure ---

  - key: schechter2007emperor
    title: "The Emperor's New Security Indicators: An evaluation of website authentication and the effect of role playing on usability studies"
    author: "Stuart E. Schechter, Rachna Dhamija, Andy Ozment, Ian Fischer"
    url: "https://stuartschechter.org/papers/emperor.pdf"
    retrieved: "2026-09-04"
    capture: "refs/captures/lit/schechter-dhamija-ozment-fischer-emperors-new-security-indicators-2007.pdf"
    status: primary
    supports: "Removing a security indicator (HTTPS lock, then a customer-chosen site-authentication image) does not stop most users from proceeding to enter credentials; the indicator's absence goes unnoticed or unheeded in a realistic banking task."
    quote: "We confirm prior findings that users ignore HTTPS indicators: no participants withheld their passwords when these indicators were removed. We present the first empirical investigation of site-authentication images, and we find them to be ineffective: even when we removed them, 23 of the 25 (92%) participants who used their own accounts entered their passwords."
    locator: "Abstract, p. 51 (2007 IEEE Symposium on Security and Privacy, pp. 51-65)"

  - key: dhamija2006phishing
    title: "Why Phishing Works"
    author: "Rachna Dhamija, J. D. Tygar, Marti Hearst"
    url: "https://people.ischool.berkeley.edu/~hearst/papers/why_phishing_works.pdf"
    retrieved: "2026-09-04"
    capture: "refs/captures/lit/dhamija-tygar-hearst-why-phishing-works-2006.pdf"
    status: primary
    supports: "A substantial fraction of users do not look at the browser chrome (address bar, status bar, padlock/security indicators) at all when judging site legitimacy, and standard security indicators fail even for sophisticated users against visual deception."
    quote: "We found that 23% of the participants did not look at browser-based cues such as the address bar, status bar and the security indicators, leading to incorrect choices 40% of the time. We also found that some visual deception attacks can fool even the most sophisticated users. These results illustrate that standard security indicators are not effective for a substantial fraction of users, and suggest that alternative approaches are needed."
    locator: "Abstract, p. 581 (CHI 2006, pp. 581-590)"

  - key: akhawe2013warningland
    title: "Alice in Warningland: A Large-Scale Field Study of Browser Security Warning Effectiveness"
    author: "Devdatta Akhawe, Adrienne Porter Felt"
    url: "https://devd.me/papers/alice-in-warningland.pdf"
    retrieved: "2026-09-04"
    capture: "refs/captures/lit/akhawe-felt-alice-in-warningland-2013.pdf"
    status: primary
    supports: "Complicates a blanket 'users ignore warnings' claim: click-through rates vary enormously by warning design (a tenth of Firefox malware/phishing warnings bypassed vs. 70.2% of Chrome SSL warnings), so warning effectiveness is a design variable, not a fixed fact about users. Directly qualifies how much weight the earlier (2006-2007) indicator-failure studies can bear, since those evaluated warning UIs since deprecated."
    quote: "During our field study, users continued through a tenth of Mozilla Firefox's malware and phishing warnings, a quarter of Google Chrome's malware and phishing warnings, and a third of Mozilla Firefox's SSL warnings. This demonstrates that security warnings can be effective in practice; security experts and system architects should not dismiss the goal of communicating security information to end users. We also find that user behavior varies across warnings. In contrast to the other warnings, users continued through 70.2% of Google Chrome's SSL warnings."
    locator: "Abstract, p. 257 (22nd USENIX Security Symposium, pp. 257-272)"

  - key: felt2015sslwarnings
    title: "Improving SSL Warnings: Comprehension and Adherence"
    author: "Adrienne Porter Felt, Alex Ainslie, Robert W. Reeder, Sunny Consolvo, Somas Thyagaraja, Alan Bettes, Helen Harris, Jeff Grimes"
    url: "https://adrifelt.github.io/sslinterstitial-chi.pdf"
    retrieved: "2026-09-04"
    capture: "refs/captures/lit/felt-et-al-improving-ssl-warnings-2015.pdf"
    status: primary
    supports: "Even a warning purpose-redesigned against warning-literature best practice, and A/B tested at scale, could not get most users to correctly identify the threat source or what data was at risk — comprehension and adherence are separable goals, and comprehension is the harder one to move. Directly disciplines any claim that adding a plainly-worded warning label will make users understand what is unverified."
    quote: "We ultimately failed at our goal of a well-understood warning. However, nearly 30% more total users chose to remain safe after seeing our warning. We attribute this success to opinionated design, which promotes safety with visual cues. [...] Our proposed text slightly improved one aspect of comprehension (the threat source), but overall comprehension rates remained low for all warning texts."
    locator: "Abstract / Introduction, p. 2893 (CHI 2015, pp. 2893-2902)"

  # --- Cluster 3: graph and DAG readability ---

  - key: ghoniem2005readability
    title: "On the Readability of Graphs Using Node-Link and Matrix-Based Representations: A Controlled Experiment and Statistical Analysis"
    author: "Mohammad Ghoniem, Jean-Daniel Fekete, Philippe Castagliola"
    url: "http://www-sop.inria.fr/orion/COGC/teams/INSITUghoniem-fivj05-final.pdf"
    retrieved: "2026-09-04"
    capture: "refs/captures/lit/ghoniem-fekete-castagliola-node-link-matrix-readability-2005.pdf"
    status: primary
    supports: "Node-link diagrams lose to matrix representations on most generic graph tasks once a graph exceeds about twenty vertices, EXCEPT path-finding (following a chain from one node to another), which node-link wins throughout the evaluation, with matrix performance improving only as graphs get large and dense. Directly constrains the arcviz layout choice: since 'follow an edge / trace a chain' is close to the central task for a credential DAG, this is evidence for node-link over a matrix/adjacency view, not a general endorsement of node-link for every task (e.g. counting links, or finding a specific node, may favor matrix at scale)."
    quote: "Only for “findPath” task did node-link diagrams prove superior to matrix-based representations, although their performance deteriorates on large and dense graphs. [...] As seen earlier, node-links perform far better than matrices on this task with regard to small sparse graphs. However, matrices outperform them about large and dense graphs."
    locator: "§4 Discussion, PDF p. 12 (extended version; journal version: Information Visualization 4(2), pp. 114-135, 2005)"

  - key: maceachren2012semiotics
    title: "Visual Semiotics & Uncertainty Visualization: An Empirical Study"
    author: "Alan M. MacEachren, Robert E. Roth, James O'Brien, Bonan Li, Derek Swingley, Mark Gahegan"
    url: "https://geography.wisc.edu/cartography/projects/publications/MacEachrenEtAl_2012_TVCG.pdf"
    retrieved: "2026-09-04"
    capture: "refs/captures/lit/maceachren-et-al-visual-semiotics-uncertainty-visualization-2012.pdf"
    status: primary
    supports: "The nearest direct analogue found for 'a node known to exist but whose contents are unknown': this is empirical work on signifying discrete categories of uncertainty (including a 'trustworthiness' / 'credibility' category, distinct from 'completeness') with discrete point symbols, finding that abstract and iconic symbol sets differ in intuitiveness per uncertainty type and that no single visual variable serves all uncertainty categories equally well. It does not address graph-structural uncertainty (a DAG node present-but-opaque) directly — the graph/DAG-specific literature search in this stream did not surface a paper that does; this is offered as the nearest analogue, not a direct answer."
    quote: "MacEachren, et al [1] match nine types of uncertainty to these three components of information: (1) accuracy/error, (2) precision, (3) completeness, (4) consistency, (5) lineage, (6) currency, (7) credibility, (8) subjectivity, and (9) interrelatedness. [...] there is a clear difference in intuitiveness for representing uncertainty among abstract sign-vehicles based upon individual visual variables. [...] iconic sign-vehicles can be more intuitive and more accurately judged when aggregated (than are abstract sign-vehicles), the abstract sign-vehicles can lead to quicker judgments."
    locator: "§2.1 Conceptualizing Uncertainty and §5 Conclusions & Discussion (IEEE TVCG 18(12), 2012; page numbers not confirmed against the published journal pagination — this is the authors' self-archived PDF)"

  - key: purchase1997aesthetic
    title: "Which Aesthetic Has the Greatest Effect on Human Understanding?"
    author: "Helen C. Purchase"
    url: "https://doi.org/10.1007/3-540-63938-1_67"
    retrieved: "2026-09-04"
    capture: ""
    status: lead
    supports: "(unverified) Widely cited as establishing that minimizing edge crossings has the largest effect on graph-reading task performance among the standard graph-drawing aesthetics, ahead of minimizing bends or maximizing symmetry."
    quote: ""
    locator: "Graph Drawing 1997 (LNCS 1353), pp. 248-261 — paywalled at the publisher (Springer); a free full text was not located during this survey. Treat as a lead. What this stream can verify instead is Ghoniem, Fekete & Castagliola's own characterization of Purchase's method and finding in their introduction (see ghoniem2005readability capture, PDF p. 1-2), which is a secondary report, not a read of Purchase's own text."

  # --- Cluster 1: credential and consent UX ---

  - key: korir2022wallet
    title: "An Empirical Study of a Decentralized Identity Wallet: Usability, Security, and Perspectives on User Control"
    author: "Maina Korir, Simon Parkin, Paul Dunphy"
    url: "https://www.usenix.org/system/files/soups2022-korir.pdf"
    retrieved: "2026-09-04"
    capture: "refs/captures/lit/korir-parkin-dunphy-decentralized-identity-wallet-2022.pdf"
    status: primary
    supports: "Directly on point for arcviz's provenance-honesty and unverified-vs-verified problem: study participants misread the mere presence of a cryptographic-looking identifier (a DID's random alphanumeric string) as itself being the security mechanism ('secure encoding or encryption'), and derived comfort from that misunderstanding rather than from any verification step. Also: users given fine-grained selective-disclosure control described feeling at fault ('personal failure') when they disclosed more than necessary, and several participants believed they could not decline to share a requested field at all, undercutting the premise that offering a disclosure control is the same as users being able to use it correctly."
    quote: "we noted multiple assertions that the randomized alphanumeric composition of the Decentralized Identifier (DID) represents the secure encoding or encryption of personal information. Of course, this was not true, yet the perceived presence of cryptography provided a sense of confidence and comfort. [...] Nadon et al. also noticed the potential for users to feel personal failure if they over-shared once given control."
    locator: "§7.1 Security Perceptions Enhanced by Trust, p. 205; §6 (participant P16 discussion), p. 203 (SOUPS 2022 / Proceedings of the Eighteenth Symposium on Usable Privacy and Security)"

  - key: sartor2022loveatfirstsight
    title: "Love at First Sight? A User Experience Study of Self-Sovereign Identity Wallets"
    author: "Sebastian Sartor, Johannes Sedlmeir, Alexander Rieger, Tamara Roth"
    url: "https://aisel.aisnet.org/ecis2022_rp/46/"
    retrieved: "2026-09-04"
    capture: ""
    status: lead
    supports: "(unverified) Reported by secondary summary as a UEQ-based usability evaluation of four SSI wallets finding decent baseline UX but that the wallets 'do not make their novelty and benefits sufficiently apparent to users.' Attempted retrieval failed (AISeL's PDF endpoint returned an HTML page, not the paper) during this survey; not read."
    quote: ""
    locator: "ECIS 2022 Research Papers, paper 46 — not fetched; do not cite in prose beyond noting its existence as a lead."

