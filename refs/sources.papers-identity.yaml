sources:

  - key: mglance2026
    title: "Measuring the Glance: An Adversarial Estimate of Habituated Perceptual Entropy in entviz and SSH Randomart"
    author: "Daniel Hardman"
    url: "https://dhh1128.github.io/papers/m-glance.pdf"
    retrieved: "2026-09-04"
    capture: "/home/daniel/code/me/papers/m-glance.md (version 1.3, revision_date 2026-07-31)"
    status: primary
    supports: "The measured/modeled cost of what a habituated glance at an entviz pill actually checks: an involuntary one-glance read of the low-to-mid teens of bits (a parallel bundle of global channels — background, color field, color bar, ellipse silhouette, blank-location pattern), climbing with deliberate attention toward a lossless ceiling (the whole SAID/AID value, at or below 512 bits) only if the viewer reads the cell text. This directly bounds what an entviz pill in a credential UI may be trusted to communicate at a glance versus on inspection."
    quote: "A habituated glance is parallel: it takes in a bundle of global channels at once, so entviz's involuntary one-glance read is the low-to-mid teens of bits, and it climbs with deliberate attention toward the lossless text ceiling — the whole value."
    locator: "Abstract, m-glance.md:16; restated with the numeric range at m-glance.md:240-245 ('entviz's involuntary one-glance gestalt is in the low-to-mid teens of bits ... The everyday number is the involuntary gestalt — low-to-mid teens — and it rises with attention rather than being a fixed figure.')"

  - key: mglance2026-caveats
    title: "Measuring the Glance: An Adversarial Estimate of Habituated Perceptual Entropy in entviz and SSH Randomart"
    author: "Daniel Hardman"
    url: "https://dhh1128.github.io/papers/m-glance.pdf"
    retrieved: "2026-09-04"
    capture: "/home/daniel/code/me/papers/m-glance.md (version 1.3, revision_date 2026-07-31)"
    status: primary
    supports: "The author's own stated caveat that every number in the paper is a modeled grind cost, not a measured human perceptual threshold, and that the qualitative claims (curve shape, direction, comparability of entviz and SSH randomart at the bare glance) are the load-bearing ones, not the specific bit counts. This is the epistemic ceiling arcviz must respect when citing these numbers."
    quote: "None of this is a human measurement, and we have been careful to say so; it is the most an adversary's arithmetic can establish before the study that would close the loop."
    locator: "§11 Conclusion, m-glance.md:406-408; see also §10, m-glance.md:382-390 ('The tolerances and salience weights are modeled from the literature, not measured on people ... the claim that entviz's design cultivates a better-than-glance habit ... is grounded in the artifact's affordances, not in observed behavior.')"

  - key: mglance2026-ceiling
    title: "Measuring the Glance: An Adversarial Estimate of Habituated Perceptual Entropy in entviz and SSH Randomart"
    author: "Daniel Hardman"
    url: "https://dhh1128.github.io/papers/m-glance.pdf"
    retrieved: "2026-09-04"
    capture: "/home/daniel/code/me/papers/m-glance.md (version 1.3, revision_date 2026-07-31)"
    status: primary
    supports: "The structural comparison between entviz and SSH randomart: comparable at the bare involuntary glance (each low-to-mid teens of bits), but entviz alone reads down to certainty because its cell text is lossless, while randomart's ~22-bit published figure is a hard ceiling with no serial headroom. This is the basis for the rule that a pill's glance-level assurance is weak on its own and must be backed by the lossless text being available on demand."
    quote: "At the ceiling, entviz is far more robust — and this is structural, not hypothesized. entviz's cell text is lossless at ≤512 bits, so a reader who attends it verifies the whole value ... The bishop has no text and no serial headroom: the density field is its entire content, and its ceiling is that ~22-bit field whether glanced or studied. One artifact can be read all the way down to certainty; the other cannot. That is the largest genuine difference between them."
    locator: "§8, m-glance.md:310-316"

  - key: zh2024
    title: "Zooko and Houdini: A Flatland Parable"
    author: "Daniel Hardman"
    url: "https://dhh1128.github.io/papers/zh.pdf"
    retrieved: "2026-09-04"
    capture: "/home/daniel/code/me/papers/zh.md (version 1.1, revision_date 2026-07-10)"
    status: primary
    supports: "Human-friendliness of a name is not a fixed, observer-independent property of an identifier — the same identifier can and should carry different friendly names for different observers, resolved locally (like address-book contact names), rather than needing one universal friendly name to satisfy Zooko's trilemma. This is the argument underneath the COIA alias convention arcviz plans to use to label entviz pills."
    quote: "The person that I call 'Regina Q. Public', you might call 'Reggie P' or 'Mom' or 'the boss'. The differences in these names don't bother us at all, because we don't look up Regina in others' contacts lists; we only look her up in our own. ... We exit the trilemma, and we achieve far better friendliness anyway, if we let humans look up identifiers using discoverable attributes, including friendly names they choose themselves, and then convert to an identifier that's secure and decentralized when they want to use actual protocols."
    locator: "zh.md:50, zh.md:74"

  - key: zh2024-alice-warning
    title: "Zooko and Houdini: A Flatland Parable"
    author: "Daniel Hardman"
    url: "https://dhh1128.github.io/papers/zh.pdf"
    retrieved: "2026-09-04"
    capture: "/home/daniel/code/me/papers/zh.md (version 1.1, revision_date 2026-07-10)"
    status: primary
    supports: "A concrete warning about false familiarity: a name that looks human-friendly to one population (e.g. 'Alice') carries no actual recognition for viewers unfamiliar with the specific referent, and can mislead across language/culture. Relevant to arcviz if it ever renders a single global alias as though it were universally recognized rather than a viewer-local convenience label."
    quote: "How many users of a blockchain are well acquainted with a person named 'Alice' that might NOT be associated with our imaginary payment address bc1qw508d6qejxtdg4y5r3zarvary0c5xw7kygt080? Is the name 'Alice' friendly for them?"
    locator: "zh.md:62"

  - key: if2026-facet-isolation
    title: "Identity Facets"
    author: "Daniel Hardman"
    url: "https://dhh1128.github.io/papers/if.pdf"
    retrieved: "2026-09-04"
    capture: "/home/daniel/code/me/papers/if.md (version 0.11, revision_date 2026-07-11)"
    status: primary
    supports: "A person's sameness across facets (mother/CEO/patient/citizen, each anchored by a distinct opaque identifier) is meant to be perceptible only to the owner, never inferred or revealed by a system to a third-party observer without the owner's explicit, one-relationship-at-a-time choice. This directly constrains arcviz: a DAG visualization must not help a viewer connect two facet-identifiers of the same real person unless the credential graph itself already discloses that link — visual correlation of undisclosed facets is exactly the leak this paper says software must not condone."
    quote: "Sameness across facets is the opposite: it is meant to be visible to Cecilia, and to no one else. A facet is, before it is anything else, a unit of isolation. ... Revealing that two facets are one person is Cecilia's call to make, one relationship at a time. In a system that works as designed, this is never a default, never an inference a stranger is meant to draw, never a leak the software condones behind her back."
    locator: "if.md:61-63"

  - key: if2026-credential-affinity
    title: "Identity Facets"
    author: "Daniel Hardman"
    url: "https://dhh1128.github.io/papers/if.pdf"
    retrieved: "2026-09-04"
    capture: "/home/daniel/code/me/papers/if.md (version 0.11, revision_date 2026-07-11)"
    status: primary
    supports: "A credential has an affinity for one facet (the AID/role it was issued to act as), not ownership by the whole person and not necessarily confinement to exactly one facet — some credentials (e.g. a notarial attestation of an act) legitimately span facets. This constrains how arcviz should label/group credentials by issuee: affinity, not strict single-facet ownership, is the right mental model, and the UI must stay honest about credentials that legitimately cross facets rather than forcing every credential into one facet bucket."
    quote: "a credential tends to have an affinity for one facet ... But affinity is the right word, not ownership — because the pull is a tendency, not a law. ... some credentials genuinely cross facets. Suppose a notary attests that I signed a document in their presence on a certain day. Which facet does that attestation belong to? It records an act, not a role."
    locator: "if.md:95, if.md:99-101"

  - key: if2026-two-tools
    title: "Identity Facets"
    author: "Daniel Hardman"
    url: "https://dhh1128.github.io/papers/if.pdf"
    retrieved: "2026-09-04"
    capture: "/home/daniel/code/me/papers/if.md (version 0.11, revision_date 2026-07-11)"
    status: primary
    supports: "The paper's own statement of the division of labor between a naming tool (COIA alias, answers 'which one is this') and a visual-comparison tool (entviz, answers 'is this the same one'). This is the explicit rationale arcviz inherits for pairing an entviz pill with a COIA alias on every rendered identifier, rather than using either alone."
    quote: "The first question is 'which one is this?' ... The answer is a friendly, local alias ... The second question is 'is this the same one?' ... Here the answer is to change the modality of the task ... render the identifier as a picture a person can compare at a glance ... Naming serves facets: it tells you which face you are dealing with. Visual comparison serves sameness: it lets a human confirm that this identifier is the same one they saw before."
    locator: "if.md:123-129"

  - key: 3dim2019-relationship-collapse
    title: "Three Dimensions of Identity"
    author: "Daniel Hardman, Jason Law"
    url: "https://dhh1128.github.io/papers/3dim.pdf"
    retrieved: "2026-09-04"
    capture: "/home/daniel/code/me/papers/3dim.md (version 1.0, revision_date 2019-01-29)"
    status: primary
    supports: "Collapsing every relationship's view of a person into a single universal identifier (as LDAP, Facebook/Google login do) enables unchecked correlation and surveillance risk. Earlier, less-developed statement of the same relationship-partitioning argument if.md later builds the facet/capacity vocabulary on top of."
    quote: "Many identity solutions collapse all versions of 'you' to a single construct. ... If everyone identifies you the same way, then they can share information about you. Unchecked, correlation and surveillance become scary."
    locator: "3dim.md:29-31"

  - key: whosign2026-lifecycle
    title: "Who Is Signing?"
    author: "Daniel Hardman"
    url: "https://dhh1128.github.io/papers/who-sign.pdf"
    retrieved: "2026-09-04"
    capture: "/home/daniel/code/me/papers/who-sign.md (version 1.0, revision_date 2026-02-07)"
    status: primary
    supports: "A signature's meaning depends on where it sits in an evidence lifecycle: an issuer's signature asserts facts about the world (the signer is an authoritative source, not the subject); a subject's signature over a collection of evidence is not a claim of authorship of the underlying facts but a claim of standing-behind; a delegated signer's signature on a live artifact derives its meaning from earlier evidence and delegation. Directly constrains what arcviz's issuer/issuee/signature-state rendering may assert about each role."
    quote: "Issuers sign credentials. These signatures assert facts about the world: legal identity, control of a resource, rights to use a brand. The signer is an authoritative source, not the subject. Subjects sign collections of evidence. When an entity assembles credentials into a dossier or similar structure, its signature is not claiming authorship of the underlying facts. It is saying: this is the set of evidence I stand behind, together, for this purpose."
    locator: "who-sign.md:81-86"

  - key: whosign2026-opacity
    title: "Who Is Signing?"
    author: "Daniel Hardman"
    url: "https://dhh1128.github.io/papers/who-sign.pdf"
    retrieved: "2026-09-04"
    capture: "/home/daniel/code/me/papers/who-sign.md (version 1.0, revision_date 2026-02-07)"
    status: primary
    supports: "A single-key signature is externally indistinguishable from a governed, multi-party, policy-controlled signing process unless the system exposes the governance structure (e.g. multisig thresholds). Relevant to arcviz's rendering of signature/witness state on an AID: a plain 'signed' badge flattens a distinction (lone key vs. governed threshold) that the underlying KEL/TEL data may actually make inspectable, and arcviz should not discard that inspectability by rendering all signatures identically."
    quote: "Unfortunately, most tech in common use today hides governance behind a single key. A sophisticated policy engine may exist internally ... but externally, the result is indistinguishable from a lone script with a leaked secret. ... Opaque control collapses meaningful distinctions, and collapsed distinctions force trust decisions to rely on reputation and hope rather than inspection."
    locator: "who-sign.md:102-106"

  - key: signauthor2026
    title: "Signing Doesn't Always Claim Authorship"
    author: "Daniel Hardman"
    url: "https://dhh1128.github.io/papers/sign-author.pdf"
    retrieved: "2026-09-04"
    capture: "/home/daniel/code/me/papers/sign-author.md (version 1.1, revision_date 2026-06-02)"
    status: primary
    supports: "A digital signature by itself proves only that someone controlling a private key processed some bytes (integrity + origin authentication); it does not by itself establish authorship, endorsement, witnessing, or authorization — those meanings must come from protocol, policy, ceremony, or surrounding evidence (e.g. a VC proofPurpose field). Directly forbids arcviz from labeling a valid signature as implying authorship, endorsement, or truth of content by default."
    quote: "A digital signature can show that someone controlling a private key processed some bytes. It does not, by itself, tell you whether they meant: 'I wrote this'. 'I witnessed this'. 'I approve this'. 'I authorise this'. 'I am acting as an agent'. Those meanings have to come from protocol, policy, ceremony, or surrounding evidence."
    locator: "sign-author.md:42-50"

  - key: avv2025-orthogonality
    title: "Authenticity vs. Veracity"
    author: "Daniel Hardman"
    url: "https://dhh1128.github.io/papers/authenticity-vs-veracity.pdf"
    retrieved: "2026-09-04"
    capture: "/home/daniel/code/me/papers/authenticity-vs-veracity.md (version 1.1, revision_date 2026-06-02)"
    status: primary
    supports: "Authenticity (truthfulness of imputed origin) and veracity (truthfulness of claimed facts in content) are orthogonal qualities that must not be collapsed. Authenticity can, if managed carefully, be reduced to an objective mathematical computation (a signature check); veracity inherently requires a subjective, reputational assessment. This is the single sharpest constraint on arcviz's verification-state rendering: cryptographic verification of a SAID/AID/signature speaks only to authenticity, never to whether the credential's content is true."
    quote: "Judgments about authenticity can — if managed very carefully — be reduced to an objective mathematical computation, whereas judgments about veracity inherently require subjective assessments of reputation."
    locator: "authenticity-vs-veracity.md:35"

  - key: avv2025-definitions
    title: "Authenticity vs. Veracity"
    author: "Daniel Hardman"
    url: "https://dhh1128.github.io/papers/authenticity-vs-veracity.pdf"
    retrieved: "2026-09-04"
    capture: "/home/daniel/code/me/papers/authenticity-vs-veracity.md (version 1.1, revision_date 2026-06-02)"
    status: primary
    supports: "The formal definitions themselves, and a worked example (court stenographer misattribution) showing authenticity can fail while veracity survives, and vice versa (a notary witnessing an affidavit's authenticity commits to nothing about its veracity)."
    quote: "Authenticity focuses on the truthfulness of an imputed origin. ... Veracity focuses on the truthfulness of claimed facts in content. ... Suppose witness X gives an account under oath, and the court stenographer accidentally misattributes their account to witness Y. This would break the authenticity of the statement, but not its veracity. Or suppose you take an affidavit to a notary; the notary witnesses the authenticity of your affidavit, but makes no commitment as to its veracity."
    locator: "authenticity-vs-veracity.md:22-33"
