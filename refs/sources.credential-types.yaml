  - key: ct-firstperson-whitepaper
    title: "White Paper — First Person Network"
    author: The First Person Project (LFDT, Ayra Association, Trust Over IP, DIF, OpenWallet Foundation)
    url: https://www.firstperson.network/white-paper
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-firstperson-whitepaper-2026-09-21.txt
    status: primary
    supports: "The project's own definitions of the two credential types it introduces — personhood credentials (PHCs) and verifiable relationship credentials (VRCs) — together with First Person credentials as their union, and First Person Certified AI agents as a credential whose subject is explicitly not human. VRCs are the catalog's cleanest attested case of a peer-issued credential with a precondition on both parties, and PHCs of an assertion scoped to an issuing community rather than made globally."
    quote: "Verifiable relationship credentials are issued peer-to-peer between holders of personhood credentials in order to attest to verifiable first-person trust relationships."
    locator: "Executive Summary, 'What is the First Person Project?'; the companion sentence on the same page reads 'Personhood credentials are issued by any ecosystem (any qualified entity such as a company, university, nonprofit community, government, etc.) who can attest to the credential holder being a real unique person within that ecosystem.'"
    note: "This page renders server-side and fetches directly, unlike the project's landing page at https://www.firstperson.network/, which renders entirely from JavaScript and yields no text. The full white paper itself — linked from this page as a Google Doc and a roughly 12 MB PDF — was not fetched, so nothing here comes from the paper's body; the material on First Person Certified AI agents is said to live in its Part Eight."

