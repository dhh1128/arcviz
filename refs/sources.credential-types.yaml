# Source records for the credential-types catalog (audit stream: what credential types the world actually enumerates).
# Format matches ../refs/sources.yaml — see ../docs/research/EVIDENCE.md for the rules.
# Owned by the credential-types stream. Do not merge into sources.yaml; do not edit sources.yaml from here.
#
# One record per DOCUMENT, not per credential type. Every quote below was read in bytes fetched on the
# `retrieved` date by this session; captures under refs/captures/credential-types/ are those same bytes
# rendered to text. Apple and Google product material carries no capture, per EVIDENCE.md rule 4 — this
# repository is public and those pages are cited by URL and description only.

sources:

  # ---------------------------------------------------------------------------
  # W3C Verifiable Credentials family
  # ---------------------------------------------------------------------------

  - key: ct-w3c-usecases
    title: "Verifiable Credentials Use Cases (W3C Group Note, 18 March 2026)"
    author: Joe Andrieu and Kevin Dean (eds.), W3C Verifiable Credentials Working Group
    url: https://www.w3.org/TR/vc-use-cases/
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-w3c-usecases-2026-09-21.txt
    status: primary
    supports: "The roughly forty distinct credentials named or implied by the 27 User Needs user stories across seven domains (education, retail, finance, healthcare, professional credentials, legal identity, devices), plus the five Focal Use Cases. This is the single densest enumeration of real-world credential kinds in the W3C corpus, and it is the source of the catalog's education, healthcare and professional-credential entries."
    quote: "Jason is looking for a new primary care physician. His health provider includes information on their web site about the physicians they have on staff, including verifiable credentials about their education, board certification, and continuing education."
    locator: "§3.5 Professional Credentials, user story C.1 'Find a doctor' (anchor #x3-5-professional-credentials)"
    note: "The load-bearing negative finding from this document is that §6 'Extant Use Cases' — the section that would list deployed credentials — is a one-sentence stub: 'Extant Use Cases are illustrative of market adoption, i.e., examples of the use of verifiable credentials in real-world applications.' There is nothing after it. Also: www.w3.org sits behind a Cloudflare interstitial that returns HTTP 403 to a Chrome user-agent; the fetch that produced this capture used a Safari user-agent and returned 200 with 308,236 bytes of HTML."

  - key: ct-w3c-dm2
    title: "Verifiable Credentials Data Model v2.0 (W3C Recommendation)"
    author: W3C Verifiable Credentials Working Group
    url: https://www.w3.org/TR/vc-data-model-2.0/
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-w3c-dm2-2026-09-21.txt
    status: primary
    supports: "The credential types that appear in the specification's own normative examples and therefore function as the reference vocabulary: ExampleDegreeCredential, ExampleAlumniCredential, ExampleDrivingLicenseCredential, PermanentResidentCard, AgeVerificationCredential, RelationshipCredential (two subjects in one credential), OpenBadgeCredential, ExampleAchievementCredential, ExampleFoodPreferenceCredential (self-asserted, no subject id), ExampleAssertCredential (subject is a presentation), ExampleMatrixCredential, and the MyPrototypeCredential placeholder."
    quote: "A developer will change MyPrototypeCredential below to the type of credential they would like to create."
    locator: "§4 getting-started prose, immediately below the prototype template"
    note: "Captured as extracted text (365 KB) from 1,023,165 bytes of source HTML; the capture is under the 400 KB threshold so nothing was truncated."

  - key: ct-w3c-impguide
    title: "Verifiable Credentials Implementation Guidelines 1.0 (W3C Group Note, 24 September 2019)"
    author: W3C Verifiable Claims Working Group
    url: https://www.w3.org/TR/vc-imp-guide/
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-w3c-impguide-2026-09-21.txt
    status: primary
    supports: "DisputeCredential — the one credential in the whole sweep whose subject is another credential and whose purpose is to contradict it — and ExampleAddressCredential. The two dispute shapes (a subject disputing a claim about themselves, and a third party disputing a claim about someone else) are the catalog's evidence that credential-about-credential is an attested pattern rather than our invention."
    quote: "The mechanism for issuing a DisputeCredential is the same as for a regular credential, except that the credentialSubject identifier in the DisputeCredential property is the identifier of the disputed credential."
    locator: "§6 Disputes, paragraph preceding Example 1"

  - key: ct-w3c-overview
    title: "Verifiable Credentials Overview (W3C Group Note)"
    author: W3C Verifiable Credentials Working Group
    url: https://www.w3.org/TR/vc-overview/
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-w3c-overview-2026-09-21.txt
    status: primary
    supports: "The two infrastructure credential types whose subjects are not parties in the world: JsonSchemaCredential (subject is a schema other credentials validate against) and BitstringStatusListCredential (subject is a set of credential statuses). Also the document's use of a single running credential type, ExampleAlumniCredential, across every securing mechanism — which is why the Overview contributes almost nothing to a type enumeration despite its length."
    quote: "If compressed using run-length compression techniques such as GZIP [RFC1952] the result is a significantly smaller set of data: the default status list size is 131,072 entries, equivalent to 16 KB of single bit values and, when only a handful of verifiable credentials are revoked, GZIP compresses the bitstring down to a few hundred bytes."
    locator: "§5 Bitstring Status List"

  - key: ct-w3c-recognized-entities
    title: "Verifiable Credentials Recognized Entities (experimental editor's draft)"
    author: W3C Credentials Community Group / editor's draft at w3c.github.io
    url: https://w3c.github.io/vc-recognized-entities/
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-w3c-recognized-entities-2026-09-21.txt
    status: secondary
    supports: "RecognizedEntityCredential, the catalog's structurally most unusual entry: a credential whose subject is a set of issuers, existing to make trust registries expressible as credentials and chainable via recognizedIn. Also the use-case narratives that name vital records (birth, marriage, death certificates), the commercial invoice, the certificate of conformity, and the CAB accreditation-scope credential."
    quote: "Rather than mandating a single central registry, the model allows any entity — a government body, an industry consortium, a standards organization, or even a single individual — to issue a `RecognizedEntityCredential` asserting that they know of one or more entities that are recognized to perform specific actions."
    locator: "§1 Introduction, second paragraph"
    note: "Marked secondary rather than primary deliberately: this is an experimental editor's draft in w3c.github.io space, not a TR-space document, and it says of itself 'not fit for production deployment.' Cite it for what the pattern looks like, never for what W3C has agreed."

  # ---------------------------------------------------------------------------
  # EU Digital Identity Wallet — reference issuer, ARF, attestation rulebooks
  # ---------------------------------------------------------------------------

  - key: ct-eudi-issuer-metadata
    title: "EUDIW Testing Issuer — OpenID4VCI issuer metadata (.well-known/openid-credential-issuer)"
    author: European Commission / EUDI Wallet reference implementation
    url: https://issuer.eudiw.dev/.well-known/openid-credential-issuer
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-eudi-issuer-metadata-2026-09-21.txt
    status: primary
    supports: "The 27 credential configurations advertised by the EU reference issuer — the largest single machine-readable enumeration of credential types in the sweep, and the only one in which each type arrives with its format, doctype or vct, display name and full claim-path list. Counted independently from the capture: credential_configurations_supported has exactly 27 keys. Fourteen of them are format pairs of the same subject matter, so the count of distinct subject matters is about 18."
    quote: "\"doctype\":\"eu.europa.ec.eudi.cor.1\" ... \"name\":\"Certificate of Residence (MSO Mdoc)\""
    locator: "JSON key path credential_configurations_supported[\"eu.europa.ec.eudi.cor_mdoc\"] — the two quoted fragments are that configuration's doctype key and its credential_metadata.display[0].name, verbatim from the compact JSON as served; the same configuration's format key is \"mso_mdoc\""
    note: "Capture is the raw 91,319-byte JSON as served, not a reformatted copy, so key paths in the locator resolve against it directly. Two details worth carrying: the SD-JWT format string throughout is dc+sd-jwt, not vc+sd-jwt; and the Photo ID configuration's doctype is org.iso.23220.2.photoid.1, which differs from both spellings Apple and the open-source verifier use (see ct-apple-photoid-descriptor and ct-mdoc-web-verifier)."

  - key: ct-eudi-issuer-landing
    title: "EUDIW Testing Issuer — landing page"
    author: European Commission / EUDI Wallet reference implementation
    url: https://issuer.eudiw.dev/
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-eudi-issuer-landing-2026-09-21.txt
    status: primary
    supports: "The gap between what the reference issuer says it offers and what it actually advertises. The prose describes only PID and mDL; the metadata at ct-eudi-issuer-metadata advertises 27 configurations. The catalog uses this to show that a human-facing description of a credential portfolio understates it by an order of magnitude."
    quote: "This is a EUDIW Testing Issuer supporting PID and mDL in mDoc and SD-JWT VC format at the following OID4VCI url: https://issuer.eudiw.dev/.well-known/openid-credential-issuer"
    locator: "page body, the single descriptive sentence below the heading 'EUDIW Testing Issuer'"

  - key: ct-eudi-arf-datamodel
    title: "EUDI Wallet ARF main document, chapter 5 — Data model and data exchange protocols"
    author: European Commission / eIDAS Expert Group
    url: https://raw.githubusercontent.com/eu-digital-identity-wallet/eudi-doc-architecture-and-reference-framework/main/docs/main/05-data-model-and-data-exchange-protocols.md
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-eudi-arf-datamodel-2026-09-21.txt
    status: primary
    supports: "The ARF's four legal categories of attestation — PID, QEAA, PuB-EAA and non-qualified EAA — which partition attestations along an axis orthogonal to subject matter, and the ARF's own definition of PID. This is the catalog's evidence that a credential's kind and its legal weight are independent dimensions: the same diploma is a QEAA or an EAA depending only on who issued it."
    quote: "Please note that the differences between them are purely legal. For example, a diploma may be a QEAA or a non-qualified EAA, depending on whether it is issued by a qualified trust service provider (QTSP) or by an unqualified one."
    locator: "§5.2.1 Overview, paragraph following the list of the four categories"

  - key: ct-eudi-arf-definitions
    title: "EUDI Wallet ARF Annex 1 — Definitions"
    author: European Commission / eIDAS Expert Group
    url: https://raw.githubusercontent.com/eu-digital-identity-wallet/eudi-doc-architecture-and-reference-framework/main/docs/annexes/annex-1/annex-1-definitions.md
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-eudi-arf-definitions-2026-09-21.txt
    status: primary
    supports: "The definition of a Wallet Unit Attestation, and of its two subtypes Wallet Instance Attestation and Key Attestation — credentials whose subject is software or a secure element rather than a person. Also Pseudonym (a zero-attribute holder artifact) and the wallet-relying party registration certificate (a credential held by the party doing the asking, constraining what it may ask for). These four are the catalog's non-person-subject cluster from the EU side."
    quote: "Wallet Unit Attestation (WUA) | A data object that describes the components of the Wallet Unit or allows authentication and validation of those components. *Note: The ARF defines two concrete subtypes: the Wallet Instance Attestation (WIA) and the Key Attestation (KA).*"
    locator: "definitions table, row 'Wallet Unit Attestation (WUA)'"

  - key: ct-eudi-arf-catalogues
    title: "EUDI ARF Discussion Paper, Topic O — Catalogues for Attestations"
    author: European Digital Identity Cooperation Group
    url: https://raw.githubusercontent.com/eu-digital-identity-wallet/eudi-doc-architecture-and-reference-framework/main/docs/discussion-topics/o-catalogues-for-attestations.md
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-eudi-arf-catalogues-2026-09-21.txt
    status: primary
    supports: "The ARF's own distinction between a machine-readable attestation scheme and a human-readable Attestation Rulebook, and the registration mechanism that is meant to populate the EU's attestation catalogue. The catalog uses this to explain why the ARF's list of concrete types is near-empty: the registry design exists, the entries do not yet."
    quote: "**Scheme for the attestation of attributes** is a machine-readable attestation definition"
    locator: "§2, first bullet of the terminology list (the adjacent bullet defines Attestation Rulebook as 'a human-readable specification of the scheme for the attestation of attributes')"
    note: "The paper states that the existing ARF catalogue requirements CAT_01 through CAT_10 'are considered outdated and will be updated' and lists them for removal, so the catalogue design was in flux as of the document's stated date."

  - key: ct-eudi-pid-rulebook
    title: "EUDI Wallet Attestation Rulebook — Person Identification Data (PID)"
    author: European Commission / eIDAS Expert Group (eudi-doc-attestation-rulebooks-catalog)
    url: https://raw.githubusercontent.com/eu-digital-identity-wallet/eudi-doc-attestation-rulebooks-catalog/main/rulebooks/pid/pid-rulebook.md
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-eudi-pid-rulebook-2026-09-21.txt
    status: primary
    supports: "The full PID attribute set (six mandatory, twelve optional per CIR 2024/2977, plus issuer metadata), and the finding that one credential carries two different type identifiers chosen by serialization format — eu.europa.ec.eudi.pid.1 as both doctype and mdoc namespace, urn:eudi:pid:1 as the SD-JWT VC type. Also attestation_legal_category, a claim whose whole job is to assert the credential's own kind."
    quote: "\"eu.europa.ec.eudi.pid.1\" will be used as the attestation type for [ISO/IEC 18013-5]-compliant PIDs."
    locator: "§3.1 (mdoc encoding), the sentence introducing the attestation type; attribute tables are in §2 and the SD-JWT VC encoding in §4.1"

  - key: ct-eudi-mdl-rulebook
    title: "EUDI Wallet Attestation Rulebook — Mobile Driving Licence (mDL)"
    author: European Commission / eIDAS Expert Group (eudi-doc-attestation-rulebooks-catalog)
    url: https://raw.githubusercontent.com/eu-digital-identity-wallet/eudi-doc-attestation-rulebooks-catalog/main/rulebooks/mdl/mdl-rulebook.md
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-eudi-mdl-rulebook-2026-09-21.txt
    status: primary
    supports: "The EUDI mDL as a type that defines no attributes of its own and instead delegates wholly to ISO/IEC 18013-5, and the negative constraint that its serialization is pinned by law rather than by preference — SD-JWT VC is forbidden because the Regulation names only ISO/IEC 18013-5. The catalog uses this as the clearest case of a credential type whose identity is entirely legal rather than structural."
    quote: "Unit SHALL NOT be implemented as [SD-JWT VC]-compliant attestations."
    locator: "§2, the sentence spanning the requirement that mDLs issued to a Wallet Unit use ISO/IEC 18013-5 encoding only; the quote is the line as it wraps in the capture"
    note: "The whole rulebook is 2,443 bytes — it is a pointer to ISO/IEC 18013-5 plus a serialization prohibition, and that thinness is itself the finding."

  - key: ct-eudi-rulebooks-catalog
    title: "eu-digital-identity-wallet/eudi-doc-attestation-rulebooks-catalog — repository tree (GitHub API)"
    author: European Commission / eIDAS Expert Group
    url: https://api.github.com/repos/eu-digital-identity-wallet/eudi-doc-attestation-rulebooks-catalog/git/trees/main?recursive=1
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-eudi-rulebooks-catalog-2026-09-21.txt
    status: primary
    supports: "The headline negative finding on the EU side: the dedicated attestation-rulebooks catalogue contains exactly two rulebooks. Verified against the capture, the blobs under rulebooks/ are rulebooks/mdl/README.md, rulebooks/mdl/mdl-rulebook.md, rulebooks/pid/README.md and rulebooks/pid/pid-rulebook.md, plus a template elsewhere in the tree. As of retrieval the ARF names PID and mDL as its only concrete attestation types with rulebooks; everything else is a registration mechanism for rulebooks not yet written."
    quote: "\"path\": \"rulebooks/mdl/mdl-rulebook.md\" ... \"path\": \"rulebooks/pid/pid-rulebook.md\""
    locator: "JSON key path tree[*].path, filtered to entries beginning 'rulebooks/'"

  # ---------------------------------------------------------------------------
  # OpenWallet Foundation and Multipaz
  # ---------------------------------------------------------------------------

  - key: ct-multipaz-doctypes
    title: "Multipaz known document types (multipaz-doctypes module, Kotlin sources and English string resources)"
    author: OpenWallet Foundation / Multipaz project (formerly Identity Credential, contributed by Google)
    url: https://github.com/openwallet-foundation/multipaz/tree/main/multipaz-doctypes/src/commonMain/kotlin/org/multipaz/documenttype/knowntypes
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-multipaz-doctypes-2026-09-21.txt
    status: primary
    supports: "The standards-track half of the only concrete credential-type catalogue anywhere in OWF: DrivingLicense (org.iso.18013.5.1.mDL), EUPersonalID, PhotoID (org.iso.23220.photoid.1), VaccinationDocument (org.micov.1), VehicleRegistration (nl.rdw.mekb.1), AgeVerification (eu.europa.ec.av.1), Aadhaar (in.gov.uidai.aadhaar.1), IDPass (com.google.wallet.idcard.1) and PaymentTransaction — each with its doctype identifier, namespace list, attribute identifiers and localized display name."
    quote: "const val MDL_DOCTYPE = \"org.iso.18013.5.1.mDL\""
    locator: "file DrivingLicense.kt, companion-object constant; the matching display name is \"document_display_name_driving_license\": \"Driving license\" in multipaz-doctypes/src/commonMain/lokalize/values/strings.json"
    note: "The capture concatenates ten separately-fetched files — nine Kotlin sources plus strings.json — each preceded by a '===== FILE:' and '===== URL:' delimiter line giving its repository path and the raw.githubusercontent.com URL it came from, so any quote resolves to one named file. The url field above is the GitHub directory those files live in; it is not itself a page that was fetched."

  - key: ct-multipaz-utopia
    title: "Multipaz Utopia example document types (multipaz-utopia module, Kotlin sources and English string resources)"
    author: OpenWallet Foundation / Multipaz project
    url: https://github.com/openwallet-foundation/multipaz/tree/main/multipaz-utopia/src/commonMain/kotlin/org/multipaz/utopia/knowntypes
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-multipaz-utopia-2026-09-21.txt
    status: primary
    supports: "The everyday half of the Multipaz catalogue, which is where the non-government credential kinds live: Loyalty card, Boarding pass, Movie ticket (an entitlement with no attribute identifying its bearer), Naturalization certificate, Certificate of residency, German personal ID, the EMVCo digital payment credential in both mdoc and SD-JWT profiles, and PingTransaction. The catalog uses these for the entitlement-shaped and transaction-shaped entries that the identity-document sources have no room for."
    quote: "const val MOVIE_TICKET_VCT = \"https://utopia.example.com/vct/movieticket\""
    locator: "file UtopiaMovieTicket.kt, companion-object constant; matching display name \"document_display_name_movie_ticket\": \"Movie ticket\" in multipaz-utopia/src/commonMain/lokalize/values/strings.json"
    note: "Same concatenated-capture convention as ct-multipaz-doctypes: ten fetched files, each preceded by '===== FILE:' and '===== URL:' delimiters. Several of these sources are candid about their own status — UtopiaBoardingPass calls itself 'An example of what a boarding pass doctype could look like', and EUCertificateOfResidence carries a TODO asking whether the document type still exists."

  - key: ct-owf-projects
    title: "Projects — OpenWallet Foundation"
    author: OpenWallet Foundation (Linux Foundation Europe)
    url: https://openwallet.foundation/projects/
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-owf-projects-2026-09-21.txt
    status: primary
    supports: "OWF's own framing of what it is for — wallet plumbing and interoperability, not credential semantics. The catalog uses this to justify recording OWF as a source of credential FORMATS rather than credential types, with Multipaz as the single exception."
    quote: "The OpenWallet Foundation is a neutral home for open source projects supporting the development of interoperable digital wallets."
    locator: "page body, first paragraph under the heading 'Projects'"
    note: "The project list itself on this page is rendered client-side, so the capture holds only the server-rendered preamble (4.4 KB of the 162 KB response). The fetchable project register is ct-owf-tac-projects; do not read the thinness of this capture as thinness in the foundation."

  - key: ct-owf-tac-projects
    title: "Projects — OpenWallet Foundation Technical Advisory Council register"
    author: OpenWallet Foundation Technical Advisory Council
    url: https://tac.openwallet.foundation/projects/
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-owf-tac-projects-2026-09-21.txt
    status: primary
    supports: "The TAC's register of OWF projects and their lifecycle stages (Growth, Labs), which is the enumeration behind the finding that exactly one OWF project — Multipaz — maintains a catalogue of concrete credential types, and that the rest define formats, agent frameworks and protocol libraries."
    quote: "Multipaz"
    locator: "projects table, Growth-stage row; the register lists each project's name against its stage"
    note: "This page is also partly client-rendered — the capture is 4.1 KB of a 92 KB response and preserves the project names and stage labels but not the full per-project prose. For a project's own description, ct-owf-tac-identity-credential is the fetchable markdown source behind one row."

  - key: ct-owf-tac-identity-credential
    title: "OWF TAC project page — Identity Credential (Multipaz)"
    author: OpenWallet Foundation Technical Advisory Council
    url: https://raw.githubusercontent.com/openwallet-foundation/tac/main/docs/projects/identity-credential.md
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-owf-tac-identity-credential-2026-09-21.txt
    status: primary
    supports: "The project's own list of the mdoc document types it implements, stated as identifier-plus-gloss pairs. This is the corroborating citation for the Multipaz doctype strings and the place where the older PID doctype spelling eu.europa.ec.eudiw.pid.1 appears alongside the current eu.europa.ec.eudi.pid.1."
    quote: "- `org.iso.18013.5.1.mDL`: Mobile Driving License"
    locator: "the bulleted document-type list; adjacent bullets read '`org.micov.1`: mdoc for eHealth', '`nl.rdw.mekb.1`: mdoc for Vehicle Registration' and '`eu.europa.ec.eudiw.pid.1`: mdoc for Personal Identification'"

  - key: ct-owf-bifold-readme
    title: "openwallet-foundation/bifold-wallet — README"
    author: OpenWallet Foundation / Bifold project
    url: https://raw.githubusercontent.com/openwallet-foundation/bifold-wallet/main/README.md
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-owf-bifold-readme-2026-09-21.txt
    status: primary
    supports: "That a shipping OWF wallet enumerates credential FORMATS where one might expect types. The catalog cites this to draw the format/type line explicitly rather than leaving it implied."
    quote: "- **Credential Formats:** Hyperledger Anoncreds, IETF SD-JWT, ISO/IEC 18013-5 mDOC, W3C VCDM 1.1/2.0 JWT/SD-JWT"
    locator: "features list, bullet 'Credential Formats'"

  - key: ct-owf-eudiplo-readme
    title: "openwallet-foundation/eudiplo — README"
    author: OpenWallet Foundation / EUDIPLO project
    url: https://raw.githubusercontent.com/openwallet-foundation/eudiplo/main/README.md
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-owf-eudiplo-readme-2026-09-21.txt
    status: primary
    supports: "The same format-not-type point from a second OWF project, and the protocol set an EU-facing issuance service considers table stakes."
    quote: "- ✅ Supports **OID4VCI**, **OID4VP**, **SD-JWT VC**, **mDOC (ISO 18013-5)**, and **OAuth Token Status"
    locator: "features list; the bullet is truncated in the source markdown exactly as quoted"
    note: "Fetched from GitHub because the project's own site at https://eudiplo.de/ fails TLS hostname verification."

  - key: ct-owf-keyring-post
    title: "KEYRING: Issuing Peer-to-Peer Relationship Credentials on top of Bifold (OWF blog)"
    author: Sean Bohan, OpenWallet Foundation
    url: https://openwallet.foundation/2026/05/21/keyring-issuing-peer-to-peer-relationship-credentials-on-top-of-bifold/
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-owf-keyring-post-2026-09-21.txt
    status: secondary
    supports: "Only that a peer-to-peer relationship credential project exists and is named KEYRING. The catalog should record the name and nothing more from this source."
    quote: "This week, Brendan Miller and Alberto Leon from the Harvard Berkman Center joined us to discuss and demo their project, KEYRING, which is built on top of the OpenWallet Foundation project Bifold."
    locator: "post body, sole substantive paragraph"
    note: "The whole post is 1.4 KB of text. It gives no credential definition, no claim names and no subject, and defers to a linked Atlassian wiki page for slides. Recorded so the idea is not lost, not as a usable entry — do not let the title's phrase 'relationship credentials' become a citation for what one contains."

  # ---------------------------------------------------------------------------
  # ISO mdoc doctypes — cited through parties that use them, never through ISO
  # ---------------------------------------------------------------------------

  - key: ct-aamva-mdl-guidelines
    title: "Mobile Driver's License Implementation Guidelines, Version 1.6 (July 2026)"
    author: American Association of Motor Vehicle Administrators (AAMVA)
    url: https://www.aamva.org/getmedia/1bc1f2b3-bc7b-4e44-8112-127a4110ad94/mDLImplementationGuidelines-16.pdf
    retrieved: "2026-09-21"
    capture: refs/captures/credential-types/ct-aamva-mdl-guidelines-2026-09-21.txt
    status: primary
    supports: "The org.iso.18013.5.1.aamva namespace and its element identifiers (domestic_driving_privileges, name_suffix, organ_donor, veteran, the truncation and aka_ family, DHS_compliance, EDL_credential and the rest) — the North American extension set carried inside an mDL. Also the deliberate name collision AAMVA records, in which sex is defined in both the ISO and AAMVA namespaces of one credential with different meanings. This is the catalog's only freely-published source for ISO mDL element detail."
