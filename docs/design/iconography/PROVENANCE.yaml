# Provenance and licence record for every third-party file in sources/.
# Each licence was read from the file actually shipped (or, where none ships, fetched from the
# project's repository), not from package metadata or recollection. Retrieved 2026-09-24.
# sha256 values are the first 16 hex digits of the file as vendored, unmodified.

sets:
  phosphor:
    project: Phosphor Icons
    package: "@phosphor-icons/core@2.1.1 (npm), assets/fill/"
    repository: https://github.com/phosphor-icons/core
    licence: MIT
    licence_read_from: "LICENSE in the npm package; also https://raw.githubusercontent.com/phosphor-icons/core/main/LICENSE"
    licence_copy: licenses/phosphor.MIT.txt
  material-symbols:
    project: Material Symbols (Google)
    package: "@material-symbols/svg-400@0.47.5 (npm), rounded/ -- a community repackaging (github.com/marella/material-symbols) of Google's icons, whose README credits Google"
    repository: https://github.com/google/material-design-icons
    licence: Apache-2.0
    licence_read_from: "LICENSE in the npm package; also https://raw.githubusercontent.com/google/material-design-icons/master/LICENSE"
    licence_copy: licenses/material-symbols.Apache-2.0.txt
  font-awesome:
    project: Font Awesome Free (Fonticons, Inc.)
    package: "@fortawesome/fontawesome-free@7.3.1 (npm), svgs/solid/"
    repository: https://github.com/FortAwesome/Font-Awesome
    licence: CC-BY-4.0
    licence_note: "Font Awesome Free is three licences: icons CC BY 4.0, fonts OFL-1.1, code MIT. Only SVG icons are used here, so only CC BY 4.0 applies."
    licence_read_from: "LICENSE.txt in the npm package; CC BY 4.0 legal code from https://creativecommons.org/licenses/by/4.0/legalcode.txt"
    licence_copy: [licenses/font-awesome-free.txt, licenses/CC-BY-4.0.txt]
  fluent:
    project: Fluent UI System Icons (Microsoft)
    package: "@fluentui/svg-icons@1.1.341 (npm), icons/"
    repository: https://github.com/microsoft/fluentui-system-icons
    licence: MIT
    licence_read_from: "The npm package ships no licence file (package.json says MIT); read from https://raw.githubusercontent.com/microsoft/fluentui-system-icons/main/LICENSE"
    licence_copy: licenses/fluent.MIT.txt
  daniel:
    project: arcviz
    note: "A sketch Daniel Hardman supplied on 2026-09-24 as the idea for org-identity; it is not used directly. The glyph is a redrawing in build.py (temple)."
    licence: Apache-2.0 (the repository's own)

considered_and_excluded:
  remixicon:
    package: remixicon@4.9.1 (npm)
    reason: "package.json declares Apache-2.0, but the License file shipped beside it is the custom 'Remix Icon License v1.0' (January 2026), which forbids distributing the icons as an icon collection. A public glyph set may be one. Not used."
  game-icons:
    repository: https://github.com/game-icons/icons
    licence: "CC BY 3.0 (license.txt in the repository; some contributors CC0)"
    reason: "Licence is fine; the style is illustrative, inconsistent and loses its detail at 32 px. Not used."

