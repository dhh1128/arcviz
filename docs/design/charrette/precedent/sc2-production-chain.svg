  <!-- footer -->
  <g>
    <rect x="16" y="1332" width="868" height="288" fill="#fbfbfb" stroke="#ccc" stroke-width="1"/>
    <text x="30" y="1358" font-size="13" font-weight="bold" fill="#111">This render is normal, and it says so by saying nothing special.</text>
    <text x="30" y="1378" font-size="11" fill="#333">Four tiers of maximal available disclosure — and still: 0 of 36 verification cells performed, the root delegator's KEL absent,</text>
    <text x="30" y="1393" font-size="11" fill="#333">the presenter unknown. No warning chrome, no degraded framing: this is what every store-fed production credential looks like (R1, P3).</text>
    <text x="30" y="1418" font-size="10.5" fill="#333">The V wall is drawn, never blank: a quiet dotted cell is "unperformed" — the honest steady state, not a countdown to green. A slashed cell is</text>
    <text x="30" y="1432" font-size="10.5" fill="#333">"unperformable with material in hand", its blocker named at the †. No fail glyph exists anywhere in this render: no host declared a fail-capable check (Rule 2c).</text>
    <text x="30" y="1456" font-size="10.5" fill="#333">Identical identifiers render as identical pills wherever they recur — <tspan font-family="Menlo, monospace">EOvbsyiK…48S</tspan> is qvi's issuee, le's issuer and ecr's issuer, one party,</text>
    <text x="30" y="1470" font-size="10.5" fill="#333">one pill face (Rule 14, P13.1). The pill rules out; it never rules in — no pill here implies a comparison was performed (P8).</text>
    <text x="30" y="1494" font-size="10" fill="#555">checks 1–9: SAID · schema · signature · KEL-anchor · delegation · edge-constraint (per edge) · issuer bona fides · revocation · duplicity</text>
    <text x="30" y="1514" font-size="10" fill="#555">precedent spent here: CATZOC (every card graded, "unassessed" is a grade, no blank default) · SRTM NUM (value channel and provenance channel never merge)</text>
    <text x="30" y="1528" font-size="10" fill="#555">· Leiden lacuna (the root hole drawn, bracketed, named — never trimmed) · vacat (qvi's committed no-edge) · ACR limitations section (the mandatory P banner)</text>
    <text x="30" y="1552" font-size="10" fill="#555">scope: everything above is a statement about this presentation, never about the world (Rule 13).</text>
    <text x="30" y="1580" font-size="10" fill="#777" font-style="italic" font-family="Georgia, serif">mock annotation, not render chrome: e.auth carries a syntactic o:"I2I" while e.le and e.qvi omit o — semantically identical with far nodes in hand,</text>
    <text x="30" y="1594" font-size="10" fill="#777" font-style="italic" font-family="Georgia, serif">so the three edge chips are worded identically; the syntactic difference exists only in the raw-bytes view (Rule 9a, pair 2).</text>
  </g>
</svg>
