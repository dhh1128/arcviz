    <rect x="238" y="897" width="126" height="17" rx="8" fill="#f3f3f3" stroke="#666" stroke-width="0.8"/>
    <text x="246" y="909" font-size="10.5" font-family="Menlo, monospace" fill="#111">EErZ90n2…_RZ</text>
