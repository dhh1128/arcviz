    <text x="184" y="932" font-size="11" fill="#333">Jordan Q. Fixture · Compliance Analyst · a.AID <tspan font-family="Menlo, monospace">ELiFwqI6…TVD</tspan></text>
    <text x="184" y="950" font-size="11" fill="#333">LEI 984500ARCV1Z0000FIX01 · dt 2026-01-17T12:00Z · e: 1 edge (le)</text>
    <g>
      <text x="184" y="982" font-size="10" fill="#333">V</text>
      <use href="#cellU" x="198" y="972" width="12" height="12"/><use href="#cellU" x="212" y="972" width="12" height="12"/><use href="#cellU" x="226" y="972" width="12" height="12"/><use href="#cellU" x="240" y="972" width="12" height="12"/><use href="#cellX" x="254" y="972" width="12" height="12"/><use href="#cellU" x="268" y="972" width="12" height="12"/><use href="#cellU" x="282" y="972" width="12" height="12"/><use href="#cellU" x="296" y="972" width="12" height="12"/><use href="#cellU" x="310" y="972" width="12" height="12"/>
