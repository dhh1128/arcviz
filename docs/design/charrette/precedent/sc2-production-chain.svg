    <rect x="21" y="103" width="858" height="56" fill="none" stroke="#111" stroke-width="0.7"/>
    <text x="34" y="128" font-size="18" font-weight="bold" fill="#111" letter-spacing="1">PRESENTER CONTROL: UNKNOWN</text>
    <text x="34" y="149" font-size="10.5" fill="#333">No evidence supplied that the presenter controls the holder AID. The checks below concern the artifact, not the presenter (axis P — placed before the vector, by design).</text>
  </g>

