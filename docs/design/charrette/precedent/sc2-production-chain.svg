  <text x="16" y="22" fill="#fff" font-size="12.5" font-weight="bold">RENDER APPARATUS</text>
  <text x="168" y="22" fill="#fff" font-size="12.5">scope: this presentation only — nothing below claims exhaustiveness (Rule 13)</text>

  <text x="16" y="62" font-size="19" font-weight="bold" fill="#111">SC2 — the production chain: deep, fully disclosed, and still incomplete</text>
  <text x="16" y="82" font-size="12.5" fill="#333" font-style="italic" font-family="Georgia, serif">fixtures: vlei_qvi → vlei_le → vlei_ecr_auth → vlei_ecr · load: corpus/loads/h7_missing_delegator_kel.json</text>

